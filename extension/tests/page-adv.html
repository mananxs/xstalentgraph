<!doctype html><html><body style="font-family:sans-serif">
<h3>Search candidates</h3>
<div class="mode"><label><input type="checkbox" id="bool"> Boolean search</label></div>
<div id="plain">
  <label>All these keywords <input id="kwall" placeholder="Enter keywords"></label><br>
  <label>Any of these keywords <input id="kwany" placeholder="Enter keywords"></label><br>
  <label>Exclude these keywords <input id="kwex" placeholder="Enter keywords"></label>
</div>
<div id="boolbox" style="display:none"><textarea id="boolq" placeholder="Enter boolean query"></textarea></div>
<div><span>Designation</span><input id="desig" placeholder="Enter designation"></div>
<div><span>Current location</span><input id="loc" placeholder="Add current location"></div>
<div><span>Preferred location</span><input id="ploc" placeholder="Add preferred location"></div>
<div class="exp"><span>Experience</span><input aria-label="Min experience (years)" id="emin"><input aria-label="Max experience (years)" id="emax"></div>
<div class="sal"><span>Annual salary</span><input aria-label="Min salary (Lacs)" id="smin"><input aria-label="Max salary (Lacs)" id="smax"></div>
<section><h4>Notice period</h4>
  <label><input type="checkbox" id="n0"> Immediate</label>
  <label><input type="checkbox" id="n15"> 15 days or less</label>
  <label><input type="checkbox" id="n30"> 1 month</label>
  <label><input type="checkbox" id="n60"> 2 months</label>
  <label><input type="checkbox" id="n90"> 3 months</label></section>
<div><span>Education</span><input id="edu" placeholder="Enter qualification"></div>
<button id="go">Search</button>
<script>
document.getElementById('bool').addEventListener('change', (e) => {
  document.getElementById('plain').style.display = e.target.checked ? 'none' : '';
  document.getElementById('boolbox').style.display = e.target.checked ? '' : 'none';
});
window.__searched = 0; document.getElementById('go').onclick = () => { window.__searched++; };
</script></body></html>
